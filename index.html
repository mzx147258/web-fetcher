<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易聊天系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f5f5;padding:10px}
.page{max-width:500px;margin:0 auto;background:white;border-radius:10px;padding:20px;box-shadow:0 0 5px #0002}
.title{text-align:center;margin-bottom:20px;font-size:20px}
.input-group{margin-bottom:15px}
.input-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;outline:none}
.btn{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:6px;margin-top:5px}
.link-btn{background:none;border:none;color:#007bff;width:100%;margin-top:10px}
#chat-page{display:none}
#msg-box{height:60vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:15px;max-width:70%;word-break:break-word}
.me{align-self:flex-end;background:#007bff;color:white}
.other{align-self:flex-start;background:#e9ecef;color:#222}
#input-area{display:flex;padding:10px;border-top:1px solid #ddd}
#text{flex:1;padding:10px;border:1px solid #ddd;border-radius:5px 0 0 5px;outline:none}
#send{padding:10px 15px;background:#007bff;color:white;border:none;border-radius:0 5px 5px 0}
.user-info{text-align:center;margin-bottom:10px;color:#666}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page" class="page">
  <div class="title">登录</div>
  <div class="input-group">
    <input type="text" id="login-user" placeholder="用户名">
  </div>
  <div class="input-group">
    <input type="password" id="login-pwd" placeholder="密码">
  </div>
  <button class="btn" onclick="login()">登录</button>
  <button class="link-btn" onclick="showReg()">去注册</button>
</div>

<!-- 注册页 -->
<div id="reg-page" class="page" style="display:none">
  <div class="title">注册</div>
  <div class="input-group">
    <input type="text" id="reg-user" placeholder="用户名">
  </div>
  <div class="input-group">
    <input type="password" id="reg-pwd" placeholder="密码">
  </div>
  <button class="btn" onclick="register()">注册</button>
  <button class="link-btn" onclick="showLogin()">返回登录</button>
</div>

<!-- 聊天页 -->
<div id="chat-page" class="page">
  <div class="user-info">欢迎：<span id="nick"></span></div>
  <div id="msg-box"></div>
  <div id="input-area">
    <input type="text" id="text" placeholder="输入消息...">
    <button id="send" onclick="sendMsg()">发送</button>
  </div>
</div>

<script>
// 切换页面
function showLogin(){
  document.getElementById('login-page').style.display='block'
  document.getElementById('reg-page').style.display='none'
  document.getElementById('chat-page').style.display='none'
}
function showReg(){
  document.getElementById('login-page').style.display='none'
  document.getElementById('reg-page').style.display='block'
  document.getElementById('chat-page').style.display='none'
}
function showChat(){
  document.getElementById('login-page').style.display='none'
  document.getElementById('reg-page').style.display='none'
  document.getElementById('chat-page').style.display='block'
}

// 注册
function register(){
  let user = document.getElementById('reg-user').value.trim()
  let pwd = document.getElementById('reg-pwd').value.trim()
  if(!user || !pwd) return alert('请输入用户名和密码')
  let users = JSON.parse(localStorage.getItem('users')||'{}')
  if(users[user]) return alert('用户名已存在')
  users[user] = pwd
  localStorage.setItem('users', JSON.stringify(users))
  alert('注册成功，请登录')
  showLogin()
}

// 登录
function login(){
  let user = document.getElementById('login-user').value.trim()
  let pwd = document.getElementById('login-pwd').value.trim()
  if(!user || !pwd) return alert('请输入')
  let users = JSON.parse(localStorage.getItem('users')||'{}')
  if(!users[user] || users[user]!==pwd) return alert('用户名或密码错误')
  localStorage.setItem('currentUser', user)
  document.getElementById('nick').innerText = user
  showChat()
}

// 发送消息
function sendMsg(){
  let user = localStorage.getItem('currentUser')
  let text = document.getElementById('text').value.trim()
  if(!text) return
  addMsg(user, text, 'me')
  document.getElementById('text').value = ''
}

// 添加消息
function addMsg(user, content, type){
  let box = document.getElementById('msg-box')
  let div = document.createElement('div')
  div.className = 'msg '+type
  div.innerText = user+': '+content
  box.appendChild(div)
  box.scrollTop = box.scrollHeight
}

// 检查是否已登录
window.onload = function(){
  let u = localStorage.getItem('currentUser')
  if(u){
    document.getElementById('nick').innerText = u
    showChat()
  }
}
</script>
</body>
</html>
